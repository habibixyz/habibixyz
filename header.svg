<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="200" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Animated Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa">
        <animate attributeName="stop-color" values="#60a5fa;#a78bfa;#38bdf8;#818cf8;#60a5fa" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#38bdf8;#818cf8;#60a5fa;#c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#60a5fa;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Animated Wave Gradients -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="waveGrad2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.6" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 42px;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 16px;
        font-weight: 500;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .tag {
        font-family: 'SF Mono', Monaco, 'Fira Code', 'Roboto Mono', monospace;
        font-size: 12px;
        font-weight: 500;
        fill: #64748b;
      }
      .status-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 600;
        fill: #38bdf8;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.9; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.9); }
      }
      .pulse-dot {
        animation: pulse 2.5s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="1" y="1" width="848" height="198" rx="16" fill="url(#bgGradient)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Subtle Cyber Grid -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="0.5">
    <line x1="0" y1="40" x2="850" y2="40" />
    <line x1="0" y1="80" x2="850" y2="80" />
    <line x1="0" y1="120" x2="850" y2="120" />
    <line x1="0" y1="160" x2="850" y2="160" />
    <line x1="170" y1="0" x2="170" y2="200" />
    <line x1="340" y1="0" x2="340" y2="200" />
    <line x1="510" y1="0" x2="510" y2="200" />
    <line x1="680" y1="0" x2="680" y2="200" />
  </g>

  <!-- Animated Bottom Waves -->
  <path d="M0 160 Q 212.5 140, 425 160 T 850 160 L 850 200 L 0 200 Z" fill="url(#waveGrad1)">
    <animate attributeName="d" 
      values="M0 160 Q 212.5 140, 425 160 T 850 160 L 850 200 L 0 200 Z;
              M0 160 Q 212.5 175, 425 160 T 850 160 L 850 200 L 0 200 Z;
              M0 160 Q 212.5 140, 425 160 T 850 160 L 850 200 L 0 200 Z" 
      dur="7s" repeatCount="indefinite" />
  </path>

  <path d="M0 170 Q 212.5 185, 425 170 T 850 170 L 850 200 L 0 200 Z" fill="url(#waveGrad2)">
    <animate attributeName="d" 
      values="M0 170 Q 212.5 185, 425 170 T 850 170 L 850 200 L 0 200 Z;
              M0 170 Q 212.5 155, 425 170 T 850 170 L 850 200 L 0 200 Z;
              M0 170 Q 212.5 185, 425 170 T 850 170 L 850 200 L 0 200 Z" 
      dur="9s" repeatCount="indefinite" />
  </path>

  <!-- Status Chip (Top Right) -->
  <g transform="translate(640, 24)">
    <rect x="0" y="0" width="180" height="28" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <circle cx="16" cy="14" r="4.5" fill="#10b981" class="pulse-dot" />
    <circle cx="16" cy="14" r="8" fill="#10b981" opacity="0.25" class="pulse-dot" />
    <text x="28" y="18.5" class="status-text" font-size="11" fill="#38bdf8">SHIPPING DAILY</text>
  </g>

  <!-- Terminal Label -->
  <text x="36" y="42" class="tag">&gt; habibixyz // core</text>

  <!-- Name Header -->
  <text x="36" y="92" class="title" fill="url(#textGrad)">Tanvir Khan</text>

  <!-- Subtitle -->
  <text x="36" y="125" class="subtitle">AI-Native Full Stack Engineer &bull; Founder @ Mirha &amp; Co.</text>

  <!-- Bottom Accent Line -->
  <rect x="36" y="142" width="260" height="2" rx="1" fill="url(#textGrad)" />

</svg>
